<main class="details-page">
    <section class="details-card">
        <h1>Detalles del contacto</h1>
    @if(contact != undefined) {
        <div class="contact-details">
            <p><strong>Nombre</strong>{{ contact.nombre }}</p>
            <p><strong>Apellido</strong>{{ contact.apellido }}</p>
            <p><strong>Teléfono</strong>{{ contact.telefono }}</p>
            <p><strong>Color</strong><span class="color-value" [style.background-color]="contact.color">{{ contact.color }}</span></p>
        </div>
    }
    @else {
        <p class="empty-message">No se encontró el contacto.</p>
    }
    </section>
</main>
