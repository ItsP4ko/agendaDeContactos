<form (submit)="onSubmit($event)">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" [formField]="formCreate.firstName">
    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" [formField]="formCreate.lastName">
    <label for="telefono">Teléfono:</label>
    <input type="text" id="telefono" [formField]="formCreate.number">
    <button type="submit">{{id()? 'Editar contacto' : 'Agregar contacto'}}</button> 
    
</form>
