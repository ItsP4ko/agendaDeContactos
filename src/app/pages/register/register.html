<main class="auth-shell">
  <section class="auth-card" aria-label="Formulario de registro">
    <div class="auth-header">
      <span class="brand">Austral</span>
      <h1>Crear cuenta</h1>
      <p>Completá tus datos para empezar.</p>
    </div>

    <form class="auth-form" (ngSubmit)="submit()" #registerForm="ngForm">
      <div class="field-group">
        <label for="name">Nombre completo</label>
        <input id="name" name="name" type="text" placeholder="Tu nombre" [(ngModel)]="name" required autocomplete="name" />
      </div>

      <div class="field-group">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" placeholder="juan@austral.edu.ar" [(ngModel)]="email" required email autocomplete="email" />
      </div>

      <div class="field-group">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" placeholder="Mínimo 6 caracteres" [(ngModel)]="password" required minlength="6" autocomplete="new-password" />
      </div>

      <div class="field-group">
        <label for="passwordConfirmation">Repetir contraseña</label>
        <input id="passwordConfirmation" name="passwordConfirmation" type="password" placeholder="Repetí tu contraseña" [(ngModel)]="passwordConfirmation" required autocomplete="new-password" />
      </div>

      <button type="submit" [disabled]="registerForm.invalid || password !== passwordConfirmation">Crear cuenta</button>
    </form>

    <p class="switch-copy">¿Ya tenés cuenta? <a routerLink="/login">Iniciar sesión</a></p>
  </section>
</main>
